<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <style>
      body {
        background: black;
        color: #e8e6e1;
      }

      a {
        color: #6db3ff;
      }

      a:visited {
        color: #d896ff;
      }

      img {
        float: left;
        height: auto;
        max-width: 200px;
      }

      h1, h1 + p {
        text-align: right;
      }

      /* the --- after the header is invisible; it just ends the photo float */
      hr {
        border: none;
        clear: left;
      }
    </style>
  </head>
  <body>
    {{ content }}
  </body>
</html>
